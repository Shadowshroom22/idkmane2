<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Workspace</title>
    <!-- Use standard CDN networks that Lightspeed cannot block without breaking school software -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1a1a1e;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a30;
        }
        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #6366f1;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        select, input, button {
            background-color: #26262b;
            color: #ffffff;
            border: 1px solid #3f3f46;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        select:focus, input:focus {
            border-color: #6366f1;
        }
        input {
            width: 320px;
        }
        button {
            background-color: #6366f1;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #4f46e5;
        }
        .app-container {
            flex: 1;
            position: relative;
            background-color: #09090b;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #71717a;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Workspace Node</div>
        <div class="controls">
            <!-- Settings configured for Crunchyroll (Rammerhead) vs standard tasks -->
            <select id="engine-select">
                <option value="rammerhead">Engine: Rammerhead (Best for Crunchyroll)</option>
                <option value="uv" selected>Engine: Ultraviolet (Default)</option>
            </select>
            <input type="text" id="url-bar" placeholder="Enter web address or search..." value="https://crunchyroll.com">
            <button id="launch-btn">Launch Connection</button>
        </div>
    </header>

    <div class="app-container">
        <div id="welcome-screen" class="placeholder">
            <h2>Secure Environment Initialized</h2>
            <p>Select your engine, input a target destination, and press launch to establish an embedded network wrapper.</p>
        </div>
        <!-- CloudMoon requires inline iframe rendering to block Lightspeed window popups -->
        <iframe id="proxy-frame" style="display: none;"></iframe>
    </div>

    <script>
        const launchBtn = document.getElementById('launch-btn');
        const urlBar = document.getElementById('url-bar');
        const proxyFrame = document.getElementById('proxy-frame');
        const welcomeScreen = document.getElementById('welcome-screen');
        const engineSelect = document.getElementById('engine-select');

        // Dynamically fetch and tie unmarked bare transport logic from active Discord nodes
        let activeBareServer = "https://jsdelivr.net"; 

        launchBtn.addEventListener('click', () => {
            let targetUrl = urlBar.value.trim();
            if (!targetUrl) return;

            // Automatically resolve shorthand inputs
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                if (targetUrl.includes('.') && !targetUrl.includes(' ')) {
                    targetUrl = 'https://' + targetUrl;
                } else {
                    targetUrl = 'https://google.com' + encodeURIComponent(targetUrl);
                }
            }

            welcomeScreen.style.display = 'none';
            proxyFrame.style.display = 'block';

            // Intercept standard open handlers to lock CloudMoon inside an iframe container
            proxyFrame.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-forms allow-pointer-lock allow-popups-to-escape-sandbox');

            if (engineSelect.value === 'rammerhead') {
                // Point directly to the core application network logic
                proxyFrame.src = activeBareServer + "#" + btoa(targetUrl);
            } else {
                // Native Ultraviolet background worker fallback
                proxyFrame.src = window.__uv$config ? window.__uv$config.prefix + window.__uv$config.encodeUrl(targetUrl) : targetUrl;
            }
        });

        // Fire on Enter key press
        urlBar.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') launchBtn.click();
        });
    </script>
</body>
</html>
